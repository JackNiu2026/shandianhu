name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.19.0
  PNPM_VERSION: 11.21.0

jobs:
  typecheck:
    name: Typecheck (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - workspace: admin
            filter: admin
          - workspace: mobile
            filter: mobile
          - workspace: server
            filter: "@lightning-tiger/server"
          - workspace: worker
            filter: "@lightning-tiger/worker"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "${{ matrix.filter }}" typecheck

  test:
    name: Test (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - workspace: admin
            filter: admin
          - workspace: mobile
            filter: mobile
          - workspace: server
            filter: "@lightning-tiger/server"
          - workspace: worker
            filter: "@lightning-tiger/worker"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "${{ matrix.filter }}" test

  database:
    name: Migration and schema contracts
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_DB: lightning_tiger_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lightning_tiger_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lightning-tiger/server prisma:generate
      - run: pnpm --filter @lightning-tiger/server db:migrate
      - run: pnpm exec tsx scripts/v2-2-smoke.mjs
      - run: pnpm exec tsx scripts/v2-3-smoke.mjs
      - run: pnpm --filter @lightning-tiger/server exec prisma migrate status --schema prisma/schema.prisma

  build:
    name: Build applications
    runs-on: ubuntu-latest
    needs: [typecheck, test, database]
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/build_only?schema=public
      JWT_SECRET: ci-build-only-secret
      WECHAT_APPID: ${{ secrets.WECHAT_APPID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lightning-tiger/server prisma:generate
      - run: pnpm --filter admin build
      - run: pnpm --filter mobile build:weapp

  container-smoke:
    name: Build and run production containers
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build release images
        uses: docker/bake-action@v6
        with:
          files: docker-bake.hcl
          targets: ci
          load: true
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
      - name: Run migration and readiness smoke
        shell: bash
        run: bash scripts/container-smoke.sh

  ci-success:
    name: CI success
    if: always()
    runs-on: ubuntu-latest
    needs: [typecheck, test, database, build, container-smoke]
    steps:
      - name: Enforce all required jobs
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
