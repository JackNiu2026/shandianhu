name: Release Images

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      REGISTRY: ${{ secrets.CONTAINER_REGISTRY }}
      IMAGE_TAG: sha-${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.CONTAINER_REGISTRY_USER }}
          password: ${{ secrets.CONTAINER_REGISTRY_TOKEN }}
      - name: Build immutable images locally
        uses: docker/bake-action@v6
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          CONTAINER_REGISTRY: ${{ env.REGISTRY }}
        with:
          files: docker-bake.hcl
          targets: release
          load: true
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
      - name: Scan released Admin image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/lightning-tiger-admin:${{ env.IMAGE_TAG }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan released Worker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/lightning-tiger-worker:${{ env.IMAGE_TAG }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan migration image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/lightning-tiger-migrator:${{ env.IMAGE_TAG }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Push approved immutable images
        run: |
          docker push "$REGISTRY/lightning-tiger-admin:$IMAGE_TAG"
          docker push "$REGISTRY/lightning-tiger-worker:$IMAGE_TAG"
          docker push "$REGISTRY/lightning-tiger-migrator:$IMAGE_TAG"
      - name: Record released commit
        run: echo "Released $IMAGE_TAG from ${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_STEP_SUMMARY"
