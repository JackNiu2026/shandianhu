# 闪电虎 — Docker Compose 编排
# 包含：PostgreSQL 数据库 + Redis 队列 + Admin 管理后台 + Worker 异步任务消费者

services:
  # ============ PostgreSQL 数据库 ============
  db:
    image: postgres:16-alpine
    container_name: lightning-tiger-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: lightning_tiger
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in environment}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============ Redis 队列（BullMQ） ============
  redis:
    image: redis:7-alpine
    container_name: lightning-tiger-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============ Database release gate ============
  migrate:
    build:
      context: .
      dockerfile: packages/admin/Dockerfile
      target: builder
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://postgres:${DB_PASSWORD:?DB_PASSWORD must be set in environment}@db:5432/lightning_tiger?schema=public"
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set in environment}
      NODE_ENV: production
    command: ["sh", "-c", "pnpm --filter @lightning-tiger/server db:migrate && pnpm --filter @lightning-tiger/server db:seed"]

  # ============ Admin 管理后台 ============
  admin:
    build:
      context: .
      dockerfile: packages/admin/Dockerfile
    container_name: lightning-tiger-admin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: "postgresql://postgres:${DB_PASSWORD:?DB_PASSWORD must be set in environment}@db:5432/lightning_tiger?schema=public"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in environment}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:10086}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      WECHAT_APPID: ${WECHAT_APPID:?WECHAT_APPID must be set in environment}
      WECHAT_SECRET: ${WECHAT_SECRET:?WECHAT_SECRET must be set in environment}
      MODEL_KEY_ENCRYPTION_KEY: ${MODEL_KEY_ENCRYPTION_KEY:?MODEL_KEY_ENCRYPTION_KEY must be set in environment}
      COS_BUCKET: ${COS_BUCKET:?COS_BUCKET must be set in environment}
      COS_REGION: ${COS_REGION:?COS_REGION must be set in environment}
      COS_SECRET_ID: ${COS_SECRET_ID:?COS_SECRET_ID must be set in environment}
      COS_SECRET_KEY: ${COS_SECRET_KEY:?COS_SECRET_KEY must be set in environment}
      NODE_ENV: production
    ports:
      - "${ADMIN_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/login').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ============ Worker 异步任务消费者 ============
  worker:
    build:
      context: .
      dockerfile: packages/worker/Dockerfile
    container_name: lightning-tiger-worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: "postgresql://postgres:${DB_PASSWORD:?DB_PASSWORD must be set in environment}@db:5432/lightning_tiger?schema=public"
      REDIS_URL: "redis://redis:6379"
      MODEL_KEY_ENCRYPTION_KEY: ${MODEL_KEY_ENCRYPTION_KEY:?MODEL_KEY_ENCRYPTION_KEY must be set in environment}
      COS_BUCKET: ${COS_BUCKET:?COS_BUCKET must be set in environment}
      COS_REGION: ${COS_REGION:?COS_REGION must be set in environment}
      COS_SECRET_ID: ${COS_SECRET_ID:?COS_SECRET_ID must be set in environment}
      COS_SECRET_KEY: ${COS_SECRET_KEY:?COS_SECRET_KEY must be set in environment}
      NODE_ENV: production
    healthcheck:
      test: ["CMD-SHELL", "node -e \"process.exit(0)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  postgres_data:
  redis_data:
