# 闪电虎 Nginx 反向代理配置
# 用法：将此文件放到 nginx conf.d 目录，或 include 到 nginx.conf

upstream lightning_tiger_admin {
    server 127.0.0.1:3000;
}

server {
    listen 80;
    server_name api.lightning-tiger.com;

    # HTTP 重定向到 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.lightning-tiger.com;

    # TLS 证书（使用 Let's Encrypt 或阿里云 SSL）
    ssl_certificate /etc/nginx/ssl/lightning-tiger.crt;
    ssl_certificate_key /etc/nginx/ssl/lightning-tiger.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    # 安全头
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1000;
    gzip_comp_level 6;

    # 静态资源缓存
    location /_next/static/ {
        proxy_pass http://lightning_tiger_admin;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, immutable";
    }

    # API 代理
    location /api/ {
        proxy_pass http://lightning_tiger_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 其他请求代理到 Next.js
    location / {
        proxy_pass http://lightning_tiger_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
