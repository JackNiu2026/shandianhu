# 闪电虎 Nginx 反向代理配置
# 用法：将此文件放到 nginx conf.d 目录，或 include 到 nginx.conf

upstream lightning_tiger_admin {
    server 127.0.0.1:3000;
}

server {
    listen 80;
    server_name api.lightning-tiger.com;

    # HTTP 重定向到 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.lightning-tiger.com;

    # TLS 证书（使用 Let's Encrypt 或阿里云 SSL）
    ssl_certificate /etc/nginx/ssl/lightning-tiger.crt;
    ssl_certificate_key /etc/nginx/ssl/lightning-tiger.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    # 安全头
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # gzip 压缩（注意：流式 NDJSON 路径禁用压缩，见下方）
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1000;
    gzip_comp_level 6;

    # 静态资源缓存
    location /_next/static/ {
        proxy_pass http://lightning_tiger_admin;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, immutable";
    }

    # V2.2 智学流式：辅导生成 NDJSON —— 关闭缓冲、关闭 gzip、延长读超时、暴露 X-Generation-Id
    location ~ ^/api/v2/tutor/conversations/[^/]+/stream$ {
        proxy_pass http://lightning_tiger_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;            # 关键：不缓冲服务器响应，立即把 chunk 推给客户端
        proxy_cache off;
        proxy_read_timeout 600s;        # 生成可能到 10 分钟级别
        proxy_send_timeout 600s;
        gzip off;                       # 关闭压缩：压缩会产生 buffer，破坏逐帧推送体验
        client_max_body_size 8m;

        # 暴露取消生成需要的 X-Generation-Id 响应头
        add_header Access-Control-Expose-Headers "X-Generation-Id" always;
    }

    # API 代理（普通接口）
    location /api/ {
        proxy_pass http://lightning_tiger_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 其他请求代理到 Next.js
    location / {
        proxy_pass http://lightning_tiger_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
